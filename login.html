<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | MEDISOFT</title>

  <!-- Estilos externos -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="icon"
    href="data:image/x-icon;base64,AAABAAEAEBAAAAAAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="imagenes/logo medisoft.png" height="50" alt="Logo" loading="lazy" />
        <img src="imagenes/letra medisoft.png" class="brand-text d-none d-sm-block" alt="Medisoft" />
      </a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container-fluid">
    <div class="row vh-100">
      <div class="col-md-6 d-none d-md-block">
        <img src="imagenes/PANEL MEDISOFT.png" alt="Login image" class="img-fluid"
          style="width: 100%; height: calc(100vh - 56px); object-fit: cover;">
      </div>

      <div class="col-md-6 d-flex align-items-center justify-content-center bg-light">
        <div class="form-container w-100" style="max-width: 950px;">
          <div class="form-container bg-white p-4 shadow rounded mx-auto" style="max-width: 420px; width: 100%;">

            <h3 class="text-center mb-4">Iniciar Sesión</h3>
            <form action="php/validar_login.php" method="POST">

              <!-- Tipo de identificación -->
              <div class="mb-3 input-icon-wrapper">
                <i class="fas fa-id-card fa-icon-left"></i>
                <select class="form-select" name="tipo_identificacion" required>
                  <option selected disabled>Tipo de identificación</option>
                  <option value="CC">Cédula de Ciudadanía</option>
                  <option value="CE">Cédula de Extranjería</option>
                  <option value="TI">Tarjeta de Identidad</option>
                </select>
              </div>

              <!-- Número de documento -->
              <div class="mb-3 input-icon-wrapper">
                <i class="fas fa-user fa-icon-left"></i>
                <input type="number" class="form-control" name="numero_documento" placeholder="Número de documento"
                  required />
              </div>

              <!-- Contraseña -->
              <div class="mb-3 input-icon-wrapper">
                <i class="fas fa-lock fa-icon-left"></i>
                <input type="password" id="contrasena" class="form-control" name="contrasena" placeholder="Contraseña"
                  required />
                <i class="fas fa-eye fa-icon-right" onclick="togglePassword('contrasena', this)"></i>
              </div>


              <button type="submit" class="btn custom-register-btn w-100">INGRESAR</button>
            </form>

            <p class="small mb-3 text-center mt-3">
              <a class="text-muted" href="php/recuperar_contrasena.php">¿Has olvidado tu contraseña?</a>
            </p>
            <p class="text-center">
              ¿Aún no tienes una cuenta? <a href="php/registro_paciente.php" class="link-info">Regístrate aquí</a>
            </p>

          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- JavaScript  -->
  <script src="js/login.js"></script>
</body>

</html>
